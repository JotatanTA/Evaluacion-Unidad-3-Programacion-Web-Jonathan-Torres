<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Formulario de Notas</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body>
  <div class="container">
    <h1>Formulario de Notas</h1>
    <form action="/ejercicio1" method="POST" autocomplete="off">
      <label for="nota1">Nota 1:</label>
      <input type="number" id="nota1" name="nota1" min="10" max="70" required>
      <br>
      <label for="nota2">Nota 2:</label>
      <input type="number" id="nota2" name="nota2" min="10" max="70" required>
      <br>
      <label for="nota3">Nota 3:</label>
      <input type="number" id="nota3" name="nota3" min="10" max="70" required>
      <br>
      <label for="asistencia">Asistencia %</label>
      <input type="number" id="asistencia" name="asistencia" min="0" max="100" required>
      <br>
      <button type="submit">Enviar</button>
    </form>

    <a href="/" class="btn-volver">Volver al Menú Principal</a>

    {% if estado %}
    <div id="resultado">
      <p>{{ promedio }}</p>
      <p>{{ estado }}</p>
    </div>
    {% endif %}
  </div>

  <script>
    window.addEventListener('pageshow', function (event) {
      var nav = performance.getEntriesByType("navigation")[0];
      if (event.persisted || (nav && nav.type === "back_forward")) {
        document.querySelector('form').reset();
        var res = document.getElementById('resultado');
        if (res) res.style.display = 'none';
      }
    });
  </script>
</body>
</html>
